name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $DATA | base64 -di > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.YOUR_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Set up keystore for signing
        run: |
          mkdir -p $HOME/.android
          mv keystore.jks $HOME/.android/keystore.jks

      - name: Build and sign APK with Gradle
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(ls app/build/outputs/apk/release/*.apk | grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$(ls app/build/outputs/apk/release/*.apk | grep -oP '[0-9]{8,}' | head -1)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version_name }}
          name: "Han1meViewer ${{ steps.version.outputs.version_name }}"
          body: |
            ## 更新内容

            - 包名重命名为 `com.wuwei.han1meviewer`
            - 自动构建签名 APK

            ## 构建信息

            - 版本号: `${{ steps.version.outputs.version_name }}`
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}

            ## 安装说明

            1. 下载 APK 文件
            2. 在 Android 设备上安装
            3. 首次安装可能需要允许"未知来源"安装
          files: |
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}