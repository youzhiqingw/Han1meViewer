name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $DATA | base64 -di > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.YOUR_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Set up keystore for signing
        run: |
          mkdir -p $HOME/.android
          mv keystore.jks $HOME/.android/keystore.jks

      - name: Build and sign APK with Gradle
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      - name: Get version info
        id: version
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BASENAME=$(basename "$APK" .apk)
          VERSION_NAME="${BASENAME#Han1meViewer-}"
          VERSION_CODE=$(printf '%s' "$BASENAME" | grep -oE '[0-9]{8,}' | head -1)
          TAG_NAME="${VERSION_NAME}-r${GITHUB_RUN_NUMBER}"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          {
            echo "## 更新内容"
            echo ""
            PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:'- %s' "$PREV_TAG..HEAD"
              echo ""
            else
              git log --pretty=format:'- %s' -10
              echo ""
            fi
            echo ""
            echo "## 构建信息"
            echo ""
            echo "- 版本号: ${{ steps.version.outputs.version_name }}"
            echo "- 版本代码: ${{ steps.version.outputs.version_code }}"
            echo "- 构建时间: ${{ github.event.head_commit.timestamp }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- 构建编号: ${{ github.run_number }}"
            echo ""
            echo "## 安装说明"
            echo ""
            echo "1. 下载 APK 文件"
            echo "2. 在 Android 设备上安装"
            echo "3. 首次安装可能需要允许\"未知来源\"安装"
          } > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Han1meViewer ${{ steps.version.outputs.version_name }}"
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
